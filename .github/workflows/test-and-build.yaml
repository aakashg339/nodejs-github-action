name: Testing and building my application
on: push
jobs:
  test:
    runs-on: ubuntu-slim
    steps:
      - name: getting my code first
        uses: actions/checkout@v7
      - name: installing node
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.1'
      - name: installing dependencies
        run: npm install
      - name: testing app
        run: npm test